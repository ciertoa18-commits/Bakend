spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1522/freepdb1}
    username: ${DB_USERNAME:FERRE}
    # Todo el valor va entre comillas para que YAML lo trate como
    # texto y no como numero. Las comillas envuelven el placeholder
    # completo: si fueran por dentro, formarian parte de la clave.
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
app:
  jwt:
    secret: ${JWT_SECRET}
